<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>HTMLプレビュー機能</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #previewArea { margin-top: 20px; border: 2px dashed #ccc; padding: 10px; }
    iframe { width: 100%; height: 500px; border: none; }
  </style>
</head>
<body>

  <h2>CSファイル プレビュー</h2>
  
  <!-- ファイル選択 -->
  <input type="file" id="fileInput" accept=".cs" />

  <!-- プレビュー表示エリア -->
  <div id="previewArea">
    <p style="color: #666;">ここにプレビューが表示されます</p>
    <iframe id="previewFrame" style="display: none;"></iframe>
  </div>

  <script>
    document.getElementById('fileInput').addEventListener('change', function(event) {
      const file = event.target.files[0];
      const previewFrame = document.getElementById('previewFrame');
      const placeholder = document.querySelector('#previewArea p');

      if (file && file.name.endsWith('.cs')) {
        const reader = new FileReader();

        // ファイルの読み込みが完了した時の処理
        reader.onload = function(e) {
          const csContent = e.target.result;
          
          // iframe内にCSコードを書き込む
          previewFrame.style.display = 'block';
          placeholder.style.display = 'none';
          
          const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
          doc.open();
          doc.write('<pre>' + csContent + '</pre>');
          doc.close();
        };

        // テキストとしてファイルを読み込む
        reader.readAsText(file);
      } else {
        alert('CSファイルを選択してください。');
      }
    });
  </script>

</body>
</html>
